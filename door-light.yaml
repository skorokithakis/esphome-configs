esphome:
  name: door-light
  friendly_name: Door light

esp8266:
  board: d1_mini

logger:

# Disable the native API since we're using MQTT instead.
# Otherwise ESPHome complains about having neither or tries both.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Door Light Fallback Hotspot"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_hostname
  discovery: false
  topic_prefix: door-light

output:
  # D2 rather than D4: D4 is GPIO2, a boot strapping pin that the chip holds high
  # during boot, which would click the relay before the firmware takes over.
  - platform: gpio
    pin: D2
    id: relay_output

light:
  - platform: binary
    id: door_light
    name: "Door light"
    output: relay_output
    # Always on after a power cut, so the light behaves like a plain lamp when
    # the wall power is cycled. The auto-off timer still applies.
    restore_mode: ALWAYS_ON
    on_turn_on:
      - script.execute: auto_off
    on_turn_off:
      - script.stop: auto_off

script:
  # A script in restart mode instead of a bare delay in on_turn_on, because a bare
  # delay keeps running after an off/on cycle and would turn the light off early.
  - id: auto_off
    mode: restart
    then:
      - delay: 10min
      - light.turn_off: door_light
